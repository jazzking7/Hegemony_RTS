services:
  command-radius:
    build: .
    restart: unless-stopped
    ports:
      - "2567:2567"
    environment:
      PORT: 2567
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:2567/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
